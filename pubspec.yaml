name: logic_retail_mobile
description: Sales Orders Management — Flutter Android/iOS
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  get_it: ^9.2.1
  go_router: ^17.3.0
  dio: ^5.11.0
  pretty_dio_logger: ^1.4.0
  fpdart: ^1.2.0
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5
  logger: ^2.7.0
  intl: ^0.20.2
  mobile_scanner: ^7.4.0
  honeywell_scanner: ^8.0.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  bloc_test: ^10.0.0
  golden_toolkit: ^0.15.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf
